name: Quality Gates
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Repository structure
        run: pnpm lint:structure
      - name: ESLint
        run: pnpm exec eslint --config eslint.config.mjs src tests scripts
      - name: Typecheck and compile tests
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Clinical-data logging guard
        run: pnpm test:no-phi-logs
      - name: Production build
        run: pnpm build
      - name: Dependency audit
        run: pnpm audit --audit-level=high
